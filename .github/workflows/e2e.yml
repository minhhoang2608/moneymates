# E2E: Android emulator on the Linux runner + Maestro flows against a release build with mock data.
# Separate from the Tester on purpose: a cold Android build takes 20+ minutes, and in one workflow it blocked
# every ticket verification behind it. It is expensive (the repo is on the 2,000 minute Free plan), so it only
# runs on demand: when the Tester or BA reports it needs E2E evidence (kick_e2e, which skips it when dev has not
# changed since the last run or a batch is still being merged), nightly, or by hand. A run is never
# cancelled by newer merges (that starved it before); extra requests collapse into one pending run. When it
# finishes it starts the Tester again, which reads the result. When it fails it files a bug (e2e-report.sh).
name: E2E
run-name: E2E on dev

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 01:00 in Vietnam

permissions: {}

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E (Android emulator + Maestro)
    if: vars.FACTORY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            last="$(gh run list --workflow e2e.yml --status completed --limit 1 --repo "$GITHUB_REPOSITORY" --json headSha --jq '.[0].headSha // ""')"
            if [[ "$last" == "$(git rev-parse HEAD)" ]]; then
              echo "run=false" >>"$GITHUB_OUTPUT"
              echo "dev has not changed since the last E2E run – nightly run skipped." >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          if [[ -f apps/mobile/package.json && -d apps/mobile/.maestro ]]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "No apps/mobile/.maestro yet – E2E skipped." >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Enable KVM
        if: steps.check.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v7
        if: steps.check.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        if: steps.check.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Build release APK (E2E mode, mock data)
        if: steps.check.outputs.run == 'true'
        working-directory: apps/mobile
        env:
          # The app reads this to load fixture QR payloads, voice transcripts and AI responses.
          EXPO_PUBLIC_E2E: "1"
        run: |
          npm ci
          npx expo prebuild --platform android --no-install --clean
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Install Maestro
        if: steps.check.outputs.run == 'true'
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >>"$GITHUB_PATH"
      - name: Run Maestro flows on emulator
        if: steps.check.outputs.run == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >-
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk &&
            maestro test apps/mobile/.maestro --format junit --output maestro-results/report.xml --test-output-dir maestro-results
      - name: Upload E2E results and screenshots
        if: always() && steps.check.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: maestro-results/
          if-no-files-found: ignore
      - name: File a bug when the flows failed
        if: failure() && steps.check.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/factory/e2e-report.sh maestro-results/report.xml
      - name: Verify again with the new result
        if: always() && vars.FACTORY_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tester.yml --ref dev --repo "$GITHUB_REPOSITORY"
