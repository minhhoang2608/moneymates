# Tester: tests only the dev branch after each merge.
#  - tests:  unit / API / golden tests (reuses ci.yml)
#  - E2E (Android emulator + Maestro) runs in its own workflow, e2e.yml; verify reads its latest completed result.
#  - verify: Claude checks every status:testing ticket's acceptance criteria against dev and the test results.
#            Pass -> status:done + close. Fail -> type:bug + status:triage (original re-verified when the bug closes).
#            Needs a physical phone -> test:real-device + needs-human.
#            Order: the Tester verifies sub-tickets first; then parent features whose sub-tickets are all closed
#            (including the one just closed) are verified end to end by the BA (BA_VERIFIES_FEATURES in factory.env),
#            who wrote their acceptance criteria and is otherwise idle between docs changes.
# The Tester and BA only run tests and report bugs; they never write tests into the repo.
name: Tester
run-name: Tester on dev

# No push trigger: claude-code-action rejects the push event, and every factory merge dispatches this
# workflow explicitly. Run it by hand after merging something yourself.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: tester
  cancel-in-progress: false

jobs:
  tests:
    if: vars.FACTORY_ENABLED == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify acceptance criteria
    needs: [tests]
    if: always() && vars.FACTORY_ENABLED == 'true' && needs.tests.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      # collect looks up each ticket's merged PR (merge_commit_of_issue)
      pull-requests: read
      actions: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TESTS_RESULT: ${{ needs.tests.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 50
      - uses: ./.github/actions/factory-setup
      - name: Latest E2E result
        # The newest finished (success or failure) e2e.yml run on dev; cancelled runs were superseded and mean nothing.
        # `none` means E2E never ran or never reached the Maestro flows (no artifact).
        run: |
          run="$(gh run list --workflow e2e.yml --branch dev --status completed --limit 20             --json databaseId,conclusion,headSha             --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")] | .[0] // empty')"
          result=none
          sha=""
          if [[ -n "$run" ]]; then
            id="$(jq -r .databaseId <<<"$run")"
            result="$(jq -r .conclusion <<<"$run")"
            sha="$(jq -r .headSha <<<"$run")"
            # The artifact only exists when Maestro produced output. No artifact means the run never reached the
            # flows (setup or build failure): that is not a product result, so it counts as none, never as a
            # failure that would open a regression bug.
            if ! gh run download "$id" --name e2e-results --dir .factory/e2e; then
              result=none
            fi
          fi
          echo "E2E_RESULT=$result" >>"$GITHUB_ENV"
          echo "E2E_SHA=$sha" >>"$GITHUB_ENV"
      - name: Live dev API smoke
        # The dev API on Hawk Host auto-deploys from dev (cron, about 5 minutes after a merge). Light checks only:
        # no AI call, the free model quotas are small.
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          mkdir -p .factory
          if [[ -z "${API_URL:-}" ]]; then
            echo '{"status":"not_configured"}' >.factory/live-api.json
            exit 0
          fi
          health="$(curl -s -m 30 -o /dev/null -w '%{http_code}' "$API_URL/health" || true)"
          features="$(curl -s -m 30 "$API_URL/me/features" || true)"
          unauth="$(curl -s -m 30 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json'             -d '{"text":"x"}' "$API_URL/ai/parse-text" || true)"
          jq -n --arg url "$API_URL" --arg health "$health" --arg features "$features" --arg unauth "$unauth"             '{url: $url, health_status: $health, me_features_body: $features, parse_text_without_secret_status: $unauth}'             >.factory/live-api.json
          { echo '### Live dev API'; echo '```json'; cat .factory/live-api.json; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - name: Report regressions on dev
        run: '"$FACTORY_BIN/tester.sh" regression'
      - id: collect
        run: '"$FACTORY_BIN/tester.sh" collect tickets'
      - name: Verify sub-tickets (Tester, Sonnet)
        id: agent
        if: steps.collect.outputs.count != '0'
        uses: ./.github/actions/run-agent
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ env.MODEL_TESTER }}
          max_turns: ${{ env.TURNS_TESTER }}
          allowed_tools: "Read,Glob,Grep,Write,Skill,Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*)"
          prompt: |
            You are the **Tester** of the MoneyMates AI software factory.
            Read `CLAUDE.md` and `.claude/agents/tester.md`, then load the `testing-strategy` skill.

            `.factory/input.json` lists the tickets in status:testing, the dev commit, and the results of the
            test jobs on dev (`tests_job`; `e2e_job` is the result of the latest completed E2E run, `none` if it never ran,
            at commit `e2e_sha`: E2E only reruns when apps/mobile changes). Maestro JUnit results and screenshots, if any,
            are in `.factory/e2e/`.
            The live dev API (deployed from dev about 5 minutes after each merge) was probed: `.factory/live-api.json`
            (health status, `/me/features` body, `/ai/parse-text` status without the app secret, which must be 401).
            Use it for `area:api` criteria about the deployed service; if the merge is newer than the deploy, use `pending`.

            Each entry has a `kind`:
            - `ticket`: a Dev sub-ticket merged into dev (find the PR via `gh pr list --state merged --search "<issue number>"`).
            - `parent_feature`: a BA feature whose `sub_tickets` are all closed. Verify the feature's user-facing,
              end-to-end acceptance criteria across all sub-tickets together (E2E flows weigh most here).
            For each one, check every acceptance criterion against the code on `dev` and the evidence: a test that covers
            it and passed, or an E2E flow. Do not modify repository files and do not write tests.
            - `pass`: every criterion is covered and green.
            - `fail`: a criterion is missing, wrong, or its test failed. Describe the bug (steps, expected, actual).
            - `real_device`: everything else passes, but a criterion can only be checked on a physical phone
              (bank deeplink, camera scan, Vietnamese speech, how an icon or native widget looks). List exactly what a
              human must check; the ticket is closed and the items go to the shared Real-device checklist.
            - `pending`: the evidence is missing for a reason that is NOT a product defect, for example `e2e_job` is
              `none` or older than the change and a criterion needs a Maestro flow, or the tests ran on a commit that
              does not contain the change. Do NOT file a bug for that. Set `"needs_e2e": true` when an E2E run would
              settle it (it is started automatically and the Tester runs again afterwards).

            Write `.factory/result.json`:
            `{"results":[{"issue":N,"verdict":"pass"|"fail"|"real_device"|"pending","needs_e2e":true|false,"notes":"<markdown, per criterion>","bug":{"title":"...","body":"<markdown with acceptance criteria>","area":"area:mobile|area:api|area:infra","priority":"priority:p0..p3"}}]}`
            (`bug` is only for `fail`.)
      - name: Apply verification (Tester)
        if: steps.agent.outcome == 'success'
        env:
          OUTCOME: ${{ steps.agent.outputs.outcome }}
        run: '"$FACTORY_BIN/tester.sh" apply'

      # Parent features: recomputed after the Tester closed its sub-tickets, so a feature whose last
      # sub-ticket was just verified is checked in the same run.
      - id: collect_parents
        if: ${{ !cancelled() }}
        run: '"$FACTORY_BIN/tester.sh" collect parents'
      - name: Verify features end to end (BA, Opus)
        id: ba_agent
        if: ${{ !cancelled() && steps.collect_parents.outputs.count != '0' }}
        uses: ./.github/actions/run-agent
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ env.MODEL_BA }}
          max_turns: ${{ env.TURNS_BA }}
          allowed_tools: "Read,Glob,Grep,Write,Skill,Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*)"
          prompt: |
            You are the **BA** of the MoneyMates AI software factory, in VERIFY mode. You wrote these feature tickets,
            so you judge whether each finished feature delivers what the user was promised, end to end.
            Read `CLAUDE.md`, `.claude/agents/ba.md` (section "Verify finished features") and `.claude/agents/tester.md`
            (how evidence is judged), then load the `testing-strategy` skill.

            `.factory/input-ba.json` lists parent features whose sub-tickets are all closed (`sub_tickets`), the dev
            commit, and the results of the test jobs on dev (`tests_job`; `e2e_job` is the latest completed E2E run, `none` if it never ran, at commit `e2e_sha`).
            Maestro JUnit results and screenshots, if any, are in `.factory/e2e/`.
            The live dev API probe (health, `/me/features`, auth check) is in `.factory/live-api.json`.

            For each feature, check every acceptance criterion of the feature ticket against the code on `dev` and the
            evidence (find the merged PRs of its sub-tickets via `gh pr list --state merged --search "<number>"`): a test
            that covers it and passed, or an E2E flow. The sub-tickets were verified one by one; you check that together
            they deliver the user-facing behaviour, including the error and empty paths named in the criteria and
            the Vietnamese UI strings in the plan. Do not modify repository files and do not write tests.
            - `pass`: every criterion is covered and green.
            - `fail`: a criterion is missing, wrong, or its test failed. Describe the bug (steps, expected, actual).
            - `real_device`: everything else passes, but a criterion can only be checked on a physical phone
              (bank deeplink, camera scan, Vietnamese speech, how an icon or native widget looks). List exactly what a
              human must check; the ticket is closed and the items go to the shared Real-device checklist.
            - `pending`: the evidence is missing for a reason that is NOT a product defect, for example `e2e_job` is
              `none` or older than the change and a criterion needs a Maestro flow, or the tests ran on a commit that
              does not contain the change. Do NOT file a bug for that. Set `"needs_e2e": true` when an E2E run would
              settle it (it is started automatically and the Tester runs again afterwards).

            Write `.factory/result.json`:
            `{"results":[{"issue":N,"verdict":"pass"|"fail"|"real_device"|"pending","needs_e2e":true|false,"notes":"<markdown, per criterion>","bug":{"title":"...","body":"<markdown with acceptance criteria>","area":"area:mobile|area:api|area:infra","priority":"priority:p0..p3"}}]}`
            (`bug` is only for `fail`.)
      - name: Apply verification (BA)
        if: ${{ !cancelled() && steps.ba_agent.outcome == 'success' }}
        env:
          OUTCOME: ${{ steps.ba_agent.outputs.outcome }}
          INPUT_FILE: .factory/input-ba.json
          VERIFIER: BA
        run: '"$FACTORY_BIN/tester.sh" apply'
