# Nhóm: empty state -> Tạo nhóm -> name + members -> save -> card with 0đ.
appId: com.moneymates.app
---
- launchApp:
    clearState: true
- tapOn:
    id: "tab-groups"
- assertVisible: "Chưa có nhóm nào"
- tapOn:
    id: "group-empty-create"
- tapOn:
    id: "group-name"
- inputText: "Đà Lạt"
- hideKeyboard
- tapOn:
    id: "member-add-input"
- inputText: "An"
- pressKey: Enter
- tapOn:
    id: "member-add-input"
- inputText: "Bình"
- pressKey: Enter
- hideKeyboard
- assertVisible: "Bình"
- scrollUntilVisible:
    element:
      id: "group-save"
- tapOn:
    id: "group-save"
- assertVisible: "Đà Lạt"
- assertVisible: "0đ"
- tapOn:
    text: "Đà Lạt"
- assertVisible:
    id: "group-total"
    text: "0đ"
- tapOn:
    id: "group-delete"
- tapOn: "Xóa"
- assertVisible: "Chưa có nhóm nào"
