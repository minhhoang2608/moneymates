# Group voice entry (E2E mode, fixture recognizer "ăn phở 50 nghìn"): group -> Thêm chi tiêu -> Voice -> save.
appId: com.moneymates.app
---
- launchApp:
    clearState: true
- tapOn:
    id: "tab-groups"
- tapOn:
    id: "group-empty-create"
- tapOn:
    id: "group-name"
- inputText: "Đà Lạt"
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "member-add-input"
- inputText: "An"
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "member-add-input"
- inputText: "Minh"
- pressKey: Enter
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "group-save"
- tapOn:
    id: "group-save"
- tapOn:
    text: "Đà Lạt"
- tapOn:
    id: "group-add-expense"
- assertVisible:
    id: "entry-mode-manual"
- tapOn:
    id: "entry-mode-voice"
- tapOn:
    id: "voice-mic"
- assertVisible: "“ăn phở 50 nghìn”"
- tapOn:
    id: "voice-use-result"
- assertVisible:
    id: "payer-picker"
- assertVisible:
    id: "amount-input"
- scrollUntilVisible:
    element:
      id: "save-button"
- tapOn:
    id: "save-button"
- assertVisible:
    id: "screen-group-detail"
- assertVisible:
    id: "group-total"
    text: "50.000đ"
