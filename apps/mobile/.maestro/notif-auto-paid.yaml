# Auto-detect: a matching TPBank debit notification marks the hand-off paid; the temporary QR image is deleted on return.
appId: com.moneymates.app
---
- runFlow: subflows/launch-fresh.yaml
- assertVisible: "Tổng quan"
- extendedWaitUntil:
    visible:
      id: "e2e-notif-enable"
    timeout: 10000
- tapOn:
    id: "e2e-notif-enable"
- tapOn:
    id: "tab-qr"
- tapOn:
    id: "scan-e2e-feed"
- extendedWaitUntil:
    visible:
      id: "screen-pay-confirm"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "pay-category-more"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "pay-category-more"
- tapOn: "Mua sắm"
- tapOn:
    id: "pay-submit"
- extendedWaitUntil:
    notVisible:
      id: "screen-pay-confirm"
    timeout: 10000
- tapOn:
    id: "e2e-notif-inject-tpbank"
- extendedWaitUntil:
    visible:
      id: "e2e-notif-status"
      text: "paid:notification"
    timeout: 10000
