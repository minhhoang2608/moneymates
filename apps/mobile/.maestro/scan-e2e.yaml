# Scan flow in E2E mode: no camera, the hidden control feeds the dynamic TPBank fixture.
appId: com.moneymates.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Tổng quan"
    timeout: 30000
- tapOn:
    id: "tab-qr"
- assertVisible:
    id: "screen-scan"
- assertVisible:
    id: "scan-frame"
- tapOn:
    id: "scan-e2e-feed"
- assertVisible:
    id: "screen-pay-confirm"
- assertVisible:
    id: "pay-confirm-bank"
    text: "TPBank · 0123456789"
- assertVisible: "Thanh toán 55\\.000đ qua TPBank"
- assertVisible:
    id: "pay-amount"
    text: "55\\.?000"
- assertVisible: "PHO 24"
- assertVisible:
    id: "pay-submit"
- tapOn:
    id: "pay-submit"
- extendedWaitUntil:
    notVisible:
      id: "screen-pay-confirm"
    timeout: 10000
- tapOn:
    id: "tab-history"
- assertVisible:
    id: "screen-history"
- assertVisible: "−55.000đ"
- assertVisible: "PHO 24"
