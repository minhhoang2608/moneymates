# Bill scan flow (E2E mode, fake image source + fixture AI): Tổng quan Chụp bill button -> accept notice -> result card.
# The fixture is e2e/fixtures/bill.json; no camera and no network.
appId: com.moneymates.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Tổng quan"
    timeout: 30000
- tapOn:
    id: "overview-entry-bill"
- assertVisible:
    id: "bill-privacy"
- tapOn:
    id: "bill-accept"
- extendedWaitUntil:
    visible:
      id: "bill-done"
    timeout: 10000
- assertVisible: "345.000đ"
- assertVisible: "Bánh căn Nhà Chung"
- assertVisible: "22/11/2026"
- assertVisible: "Ăn uống"
- assertVisible:
    id: "bill-result"
- tapOn:
    id: "bill-retake"
- extendedWaitUntil:
    visible:
      id: "bill-done"
    timeout: 10000
- assertVisible: "345.000đ"
- assertVisible: "Bánh căn Nhà Chung"
- assertVisible: "22/11/2026"
- assertVisible: "Ăn uống"
- assertVisible:
    id: "bill-result"
