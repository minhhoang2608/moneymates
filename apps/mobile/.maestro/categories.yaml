# Danh mục: Hồ sơ -> Danh mục -> add "Cà phê" -> visible -> delete -> gone.
appId: com.moneymates.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Tổng quan"
    timeout: 30000
- tapOn:
    id: "tab-profile"
- tapOn:
    id: "row-categories"
- assertVisible:
    id: "screen-categories"
- tapOn:
    id: "category-add"
- extendedWaitUntil:
    visible:
      id: "category-sheet"
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: "category-name-input"
- inputText: "Cà phê"
- tapOn:
    id: "category-sheet-title"
- waitForAnimationToEnd
- tapOn:
    id: "category-save"
- extendedWaitUntil:
    notVisible:
      id: "category-sheet"
    timeout: 10000
- scrollUntilVisible:
    element: "Cà phê"
    centerElement: true
- assertVisible: "Cà phê"
- tapOn: "Xóa"
- tapOn: "Xóa"
- assertNotVisible: "Cà phê"
