# Undo from the return banner removes the saved payment (E2E mode: the bank app is not opened).
appId: com.moneymates.app
---
- runFlow: subflows/launch-fresh.yaml
- assertVisible: "Tổng quan"
- tapOn:
    id: "tab-qr"
- tapOn:
    id: "scan-e2e-feed"
- extendedWaitUntil:
    visible:
      id: "screen-pay-confirm"
    timeout: 10000
- tapOn:
    id: "pay-category-more"
- tapOn: "Mua sắm"
- tapOn:
    id: "pay-submit"
- extendedWaitUntil:
    visible:
      id: "handoff-return-banner"
    timeout: 10000
- assertVisible: "Đã lưu 55\\.000đ.*"
- tapOn:
    id: "handoff-undo"
- tapOn:
    id: "tab-history"
- assertVisible:
    id: "screen-history"
- assertNotVisible: "−55.000đ"
