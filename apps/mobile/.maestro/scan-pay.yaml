# Scan → pay hand-off in E2E mode: the bank app is not opened (stub), the return banner appears.
appId: com.moneymates.app
---
- runFlow: subflows/launch-fresh.yaml
- assertVisible: "Tổng quan"
- tapOn:
    id: "tab-qr"
- tapOn:
    id: "scan-e2e-feed"
- extendedWaitUntil:
    visible:
      id: "screen-pay-confirm"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "pay-category-more"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "pay-category-more"
- tapOn: "Mua sắm"
- tapOn:
    id: "pay-submit"
- extendedWaitUntil:
    visible:
      id: "handoff-return-banner"
    timeout: 10000
- assertVisible: "Đã lưu 55\\.000đ.*"
- assertVisible:
    id: "handoff-undo"
- assertNotVisible: "Đã thanh toán xong chưa?"
- tapOn:
    id: "tab-history"
- assertVisible:
    id: "screen-history"
- assertVisible: "−55.000đ"
- assertVisible: "Mua sắm · .*"
