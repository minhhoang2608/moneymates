# Group summary: create group with An and Bình -> add 900.000 expense -> Tổng kết -> mark An paid.
appId: com.moneymates.app
---
- launchApp:
    clearState: true
- tapOn:
    id: "tab-groups"
- tapOn:
    id: "group-empty-create"
- tapOn:
    id: "group-name"
- inputText: "Đà Lạt"
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "member-add-input"
- inputText: "An"
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "member-add-input"
- inputText: "Bình"
- pressKey: Enter
- waitForAnimationToEnd
- assertVisible:
    id: "screen-group-edit"
- scrollUntilVisible:
    element:
      id: "member-name-2"
- assertVisible:
    id: "member-name-1"
    text: "An"
- assertVisible:
    id: "member-name-2"
    text: "Bình"
- scrollUntilVisible:
    element:
      id: "group-save"
- tapOn:
    id: "group-save"
- tapOn:
    text: "Đà Lạt"
- tapOn:
    id: "group-add-expense"
- tapOn:
    id: "amount-input"
- inputText: "900000"
- tapOn:
    id: "amount-preview"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "category-row"
- tapOn:
    id: "category-row"
- tapOn: "Ăn uống"
- tapOn:
    id: "save-button"
- tapOn:
    id: "group-summary"
- assertVisible:
    id: "screen-group-summary"
- assertVisible: "+600.000đ"
- assertVisible: "An trả Tôi 300.000đ"
- assertVisible: "Bình trả Tôi 300.000đ"
- scrollUntilVisible:
    element:
      id: "summary-remaining"
- assertVisible: "Còn phải thu"
- tapOn:
    text: "Đã trả"
    index: 0
- assertNotVisible: "An trả Tôi 300.000đ"
- assertVisible: "Bình trả Tôi 300.000đ"
