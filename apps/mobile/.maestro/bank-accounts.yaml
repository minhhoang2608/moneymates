appId: com.moneymates.app
---
- runFlow: subflows/launch-fresh.yaml
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "row-bank-accounts"
- tapOn:
    id: "row-bank-accounts"
- assertVisible:
    id: "screen-bank-accounts"
- tapOn:
    id: "account-add"
- tapOn:
    id: "account-bank"
- tapOn:
    id: "bank-option-TPB"
- tapOn:
    id: "account-no"
- inputText: "0123456789"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "account-save"
- tapOn:
    id: "account-save"
- assertVisible: "Mặc định"
- tapOn: "TPBank · 0123 4567 89"
- assertVisible:
    id: "account-qr"
