# Settings take effect: a new money source shows in the entry form, and pay-confirm lists the enabled apps.
appId: com.moneymates.app
---
- runFlow: subflows/launch-fresh.yaml
- assertVisible: "Tổng quan"
- tapOn:
    id: "tab-profile"
- tapOn:
    id: "row-settings"
- assertVisible:
    id: "screen-settings"
- scrollUntilVisible:
    element:
      id: "settings-sources-row"
- tapOn:
    id: "settings-sources-row"
- scrollUntilVisible:
    element:
      id: "settings-source-add"
- tapOn:
    id: "settings-source-name"
- inputText: "Visa"
- scrollUntilVisible:
    direction: UP
    element:
      id: "settings-general-heading"
- tapOn:
    id: "settings-general-heading"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "settings-source-kind-card"
- tapOn:
    id: "settings-source-kind-card"
- scrollUntilVisible:
    element:
      id: "settings-source-add"
- tapOn:
    id: "settings-source-add"
- assertVisible: "Visa"
- back
- tapOn:
    id: "tab-overview"
- tapOn:
    id: "overview-add-button"
- tapOn:
    id: "entry-menu-manual"
- scrollUntilVisible:
    element:
      id: "money-source-row"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "money-source-row"
- assertVisible: "Visa"
- tapOn: "Visa"
- scrollUntilVisible:
    element:
      text: "Visa ›"
    direction: DOWN
    timeout: 10000
- assertVisible: "Visa ›"
# The manual form is a stack route without the tab bar; close it to get back to the tabs.
- tapOn:
    id: "close-button"
- tapOn:
    id: "tab-qr"
- tapOn:
    id: "scan-e2e-feed"
- assertVisible:
    id: "screen-pay-confirm"
- assertVisible:
    id: "pay-confirm-bank"
- scrollUntilVisible:
    element:
      id: "pay-app-row-name"
- assertVisible:
    id: "pay-app-row-name"
    text: "TPBank"
