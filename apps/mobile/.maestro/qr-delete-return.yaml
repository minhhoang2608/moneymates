# Album bank (TPBank fixture): after returning from the bank app the temporary QR image is deleted and the banner says so.
appId: com.moneymates.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Tổng quan"
    timeout: 30000
- tapOn:
    id: "tab-qr"
- tapOn:
    id: "scan-e2e-feed"
- extendedWaitUntil:
    visible:
      id: "screen-pay-confirm"
    timeout: 10000
- tapOn:
    id: "pay-category-more"
- tapOn: "Mua sắm"
- tapOn:
    id: "pay-submit"
- extendedWaitUntil:
    visible:
      id: "handoff-return-banner"
    timeout: 10000
- assertNotVisible:
    id: "handoff-qr-deleted"
- pressKey: home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "handoff-qr-deleted"
    timeout: 10000
- assertVisible: "Đã xoá ảnh QR tạm khỏi Ảnh"
